[package]
name = "syndes"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "syndes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Rust scoring core (spec 04): hashing, the authoritative normalizer, constant-time compare.
sha2 = "0.10"
hex = "0.4"
subtle = "2.5"
unicode-normalization = "0.1"
regex = "1"
# CSPRNG for per-question salts at seal time (spec 03/04). getrandom draws from the
# OS entropy source directly - no seeding, no state to get wrong.
getrandom = "0.3"
# HTTP client for the TEACHER-SIDE, ONLINE-ONLY Groq generation path (spec 03 T2/T4).
# Pinned to an exact 0.12.x. default-features=false + rustls-tls keeps us off the
# system OpenSSL/native-tls, and the `blocking` client lets the generate command
# stay synchronous (no tokio runtime pulled into the command boundary). NEVER used
# on the student/offline scoring path (spec 03 R5).
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "blocking"] }
# Loads GROQ_API_KEY from a local .env at startup for the teacher-side generation
# path (spec 03). .env is gitignored; absence is fine (student machines have none).
dotenvy = "0.15"
# --- Local session cache (SPEC B) -------------------------------------------
# Offline JWT verification (Layer 2): verifies the Supabase access_token
# signature against cached JWKS keys and checks `exp`. `jsonwebtoken` carries its
# own RSA/EC verification; no system OpenSSL. Used only on the auth path.
jsonwebtoken = "9"
# Local SQLite store for the cached session (and a durable home for app data).
# `bundled` compiles SQLite in-tree so there is no system libsqlite3 dependency
# on student machines.
rusqlite = { version = "0.32", features = ["bundled"] }
# base64url decode of the JWT payload for the up-front claim-contract shape check
# (the trust decision is still the signature verify in `jsonwebtoken`).
base64 = "0.22"


[dev-dependencies]
# Property-based tests for the SPEC B correctness properties (P1/P4 no-fail-open,
# P2 strict fallback, P6 removable layer).
proptest = "1"
# Mint real RSA-signed JWTs + matching JWKS in the auth integration test so the
# offline verify path is exercised end-to-end (sign -> cache -> verify) rather
# than mocked. Test-only; never compiled into the shipped app.
rsa = { version = "0.9", features = ["std"] }
rand = "0.8"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
