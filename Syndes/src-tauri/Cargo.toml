[package]
name = "syndes"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "syndes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Rust scoring core (spec 04): hashing, the authoritative normalizer, constant-time compare.
sha2 = "0.10"
hex = "0.4"
subtle = "2.5"
unicode-normalization = "0.1"
regex = "1"
# CSPRNG for per-question salts at seal time (spec 03/04). getrandom draws from the
# OS entropy source directly - no seeding, no state to get wrong.
getrandom = "0.3"
# HTTP client for the TEACHER-SIDE, ONLINE-ONLY Groq generation path (spec 03 T2/T4).
# Pinned to an exact 0.12.x. default-features=false + rustls-tls keeps us off the
# system OpenSSL/native-tls, and the `blocking` client lets the generate command
# stay synchronous (no tokio runtime pulled into the command boundary). NEVER used
# on the student/offline scoring path (spec 03 R5).
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "blocking"] }
# Loads GROQ_API_KEY from a local .env at startup for the teacher-side generation
# path (spec 03). .env is gitignored; absence is fine (student machines have none).
dotenvy = "0.15"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
